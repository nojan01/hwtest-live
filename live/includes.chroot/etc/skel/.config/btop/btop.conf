#? Hardwaretest Live: Voreinstellungen für die iLO-Konsole (Matrox G200, 1024x768)
#* DejaVu Sans Mono hat keine Braille-Zeichen -> Graphen mit Blockzeichen
graph_symbol = "block"
#* 24-Bit-Farben auf 256 Farben umrechnen (xterm-256color)
truecolor = False
update_ms = 1000
#* Ohne Prozessliste: MEM/NET nutzen die volle Breite (Taste 4 blendet sie ein)
shown_boxes = "cpu mem net"
